name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy-staging:
    # Deploy every pull request to the staging Worker once CI passes, so changes
    # can be exercised against a real deployment BEFORE they reach the live app.
    # Staging has its own Supabase project — it cannot touch production data
    # (src/lib/supabase-admin.ts refuses to start if it would). See docs/STAGING.md.
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # One staging environment, so deploys queue rather than race. Never cancel a
    # half-finished deploy: that would leave staging in an in-between state.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to staging
        run: npm run cf:deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Build-time marker → renders the "Staging" badge. Must be set here
          # rather than in the Worker config: `/` is statically prerendered, so
          # this value is baked in during the build.
          NEXT_PUBLIC_APP_ENV: staging

      - name: Where to test
        run: |
          echo "### Staging deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This PR is now live on the staging app. Test it there before merging." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**https://ai-tools-staging.meetajinkyaj.workers.dev**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Fixed URL — it does not change per PR. Look for the \"Staging · not live data\" badge." >> "$GITHUB_STEP_SUMMARY"

  e2e:
    # Exercise the real staging deployment in a real browser, after it updates.
    # This is the gate that used to be "a human remembered to click through it".
    # Every test is read-only (no signup, no writes) — see docs/TESTING.md.
    needs: deploy-staging
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E against staging
        run: npm run e2e:staging

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    # Auto-deploy to Cloudflare on every push to main, once CI passes.
    # Requires repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and
    # CLOUDFLARE_ACCOUNT_ID. Worker secrets (ANTHROPIC_API_KEY, Privy/Supabase)
    # persist across deploys and are not touched here.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

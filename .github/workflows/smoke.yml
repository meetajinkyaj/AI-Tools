name: Production smoke

# Watches the LIVE app on a schedule.
#
# Why this exists: CI only tests staging, so production can break without a
# single red check anywhere. That happened, a Privy allowed-domains edit
# dropped app.ikigaro.com, every user got an endless splash screen, and it went
# unnoticed for a day while CI stayed green. Nothing in the code was wrong,
# which is exactly the class of failure this catches: the app is only healthy if
# its configuration is healthy too.
#
# The suite is read-only by design (no signup, no writes, see docs/TESTING.md),
# so pointing it at production is safe.

on:
  schedule:
    # Every 30 minutes. GitHub delays scheduled runs (we have seen 90+ minutes
    # on this repo), so treat this as "roughly half-hourly", not a guarantee.
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Never let two runs overlap; a slow run should be skipped, not queued up.
concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test production
        run: npm run e2e:production

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## Production smoke test FAILED :rotating_light:"
            echo ""
            echo "The live app at https://app.ikigaro.com is misbehaving **right now**."
            echo ""
            echo "This suite only reads, it never writes, so a failure means the"
            echo "deployment or its configuration is broken, not the test data."
            echo ""
            echo "Most likely causes, in order:"
            echo "1. **Privy allowed domains** no longer include \`https://app.ikigaro.com\`"
            echo "   (symptom: the app hangs on the startup splash forever)."
            echo "2. A bad deploy, check the most recent \`deploy\` job on \`main\`."
            echo "3. Cloudflare: Bot Fight Mode re-enabled, or a Worker var wiped."
            echo "4. Supabase or Anthropic outage / exhausted billing."
            echo ""
            echo "Download the **smoke-report** artifact above for traces and screenshots."
          } >> "$GITHUB_STEP_SUMMARY"

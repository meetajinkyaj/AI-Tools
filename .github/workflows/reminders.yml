name: Daily reminders (backup)

# BACKUP SENDER. The primary is now the `ikigaro-reminders` Cloudflare Worker
# (workers/reminders), on a Cloudflare cron trigger that actually fires on time.
# GitHub's scheduler was running this job 90-110 minutes late every single day
# — measured, not suspected — which turned a "6 PM check-in nudge" into a
# 7:40 PM one.
#
# This is kept because sends are at-most-once (the app marks people notified
# BEFORE returning them), so a late second run is harmless: it finds 0 due and
# does nothing. That makes it a free safety net if the Worker ever fails, and
# a break-glass manual sender via "Run workflow".
#
# Required repo secrets:
#   CRON_SECRET        - shared with the Worker's CRON_SECRET; authorizes the
#                        /api/cron/due-reminders call.
#   VAPID_PUBLIC_KEY   - the public VAPID key (also committed for the client).
#   VAPID_PRIVATE_KEY  - the secret VAPID key; lives ONLY here.
# Optional repo variable:
#   APP_URL            - defaults to https://app.ikigaro.com

on:
  schedule:
    # Nominally 18:00 IST; in practice GitHub delivers this 1.5-2 hours late,
    # which is exactly why it is no longer the primary. Left enabled so that if
    # the Worker ever stops firing, users still get a late nudge rather than
    # none at all.
    - cron: "30 12 * * *"
  workflow_dispatch: {} # break-glass manual send

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # web-push is only needed by this job — install it ad hoc so it never
      # enters the app's dependency tree or the Worker bundle.
      - run: npm install --no-save web-push@^3

      - name: Send reminders
        run: node scripts/send-reminders.mjs
        env:
          APP_URL: ${{ vars.APP_URL || 'https://app.ikigaro.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:hello@ikigaro.com

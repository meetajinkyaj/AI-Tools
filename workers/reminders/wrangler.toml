name = "ikigaro-reminders"
main = "src/index.ts"
# Explicit rather than relying on the default: the only route is the manual
# trigger (CRON_SECRET-authenticated), which is how the pipeline gets tested
# without waiting for 6 PM.
workers_dev = true
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# 12:30 UTC = 18:00 IST. Cloudflare cron triggers fire on time, this exists
# because GitHub Actions' scheduler was running the same job 90-110 minutes
# late every day.
# 02:00 UTC = 07:30 IST is the wearable sync: late enough that vendors have
# finalised the night's sleep, early enough that the data is there when someone
# opens the app in the morning. The handler branches on which cron fired.
[triggers]
crons = ["30 12 * * *", "0 2 * * *"]

# Plaintext vars are REPLACED from this file on every deploy, never set them
# in the dashboard. Secrets (`wrangler secret put --config <this file>`)
# persist: CRON_SECRET, VAPID_PRIVATE_KEY.
[vars]
APP_URL = "https://app.ikigaro.com"
VAPID_SUBJECT = "mailto:hello@ikigaro.com"
# Public half of the VAPID pair; safe to commit (it ships in the client bundle
# too, see src/lib/vapid-public-key.ts) and must match it.
VAPID_PUBLIC_KEY = "BO0_4R3vGWEJE8aBprqv7itcTFbC-SlJp5nlRxE5iyPoHrNPefYHrFkMReEV5maL2QIh2VuXlfy1OraFTVzuTnU"

[observability.logs]
enabled = true
